<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>写真の一括ダウンロード</title>
<link rel="stylesheet" href="styles.css">
<style>
  .box { max-width: 560px; margin: 40px auto; padding: 0 16px; line-height: 1.9; }
  .box h1 { font-size: 22px; } .box button { width: 100%; border: 0; margin-top: 14px; }
  .box button:disabled { opacity: .5; } #log { margin-top: 16px; font-size: 14px; color: var(--muted); white-space: pre-wrap; }
</style>
</head>
<body>
<div class="box">
  <h1>写真の一括ダウンロード</h1>
  <p id="info">読み込み中…</p>
  <button class="btn primary" id="go" disabled>ZIPでまとめてダウンロード</button>
  <div class="bar"><i id="bar"></i></div>
  <div id="log"></div>
</div>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
const PER_ZIP = 200;   // 1つのZIPに入れる枚数（パソコンのメモリを使いすぎないため分割）
const $ = (id) => document.getElementById(id);
let photos = [];

(async () => {
  try {
    photos = await fetchPhotos(null);
    const n = Math.ceil(photos.length / PER_ZIP);
    $("info").textContent = photos.length
      ? `全部で ${photos.length} 枚あります。${n > 1 ? `${n} 個のZIPに分けて保存します。` : ""}パソコンでの実行がおすすめです。`
      : "まだ写真がありません。";
    $("go").disabled = !photos.length;
  } catch { $("info").textContent = "読み込めませんでした。URLの合言葉（?k=...）を確認してください。"; }
})();

$("go").onclick = async () => {
  $("go").disabled = true;
  let done = 0, missing = 0;
  for (let part = 0; part * PER_ZIP < photos.length; part++) {
    const files = [];
    for (const [i, p] of photos.slice(part * PER_ZIP, (part + 1) * PER_ZIP).entries()) {
      const no = String(part * PER_ZIP + i + 1).padStart(4, "0");
      const who = (p.guest_name || "guest").replace(/[\\/:*?"<>|\s]+/g, "_");
      try {
        const r = await fetch(publicUrl(p.path));
        if (!r.ok) throw new Error(r.status);
        files.push({ name: `${no}_${who}.jpg`, data: new Uint8Array(await r.arrayBuffer()), date: new Date(p.created_at) });
      } catch { missing++; }
      $("bar").style.width = `${(++done / photos.length) * 100}%`;
      $("log").textContent = `${done} / ${photos.length} 枚を取得中…`;
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(makeZip(files));
    a.download = `wedding-photos-${String(part + 1).padStart(2, "0")}.zip`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }
  $("log").textContent = `完了しました（${photos.length - missing} 枚）。` + (missing ? `\n${missing} 枚は取得できませんでした。もう一度お試しください。` : "");
  $("go").disabled = false;
};

// 無圧縮ZIPを作る（JPEGは元々圧縮済みなので詰めるだけで十分）
const CRC = Array.from({ length: 256 }, (_, n) => { for (let k = 0; k < 8; k++) n = n & 1 ? 0xedb88320 ^ (n >>> 1) : n >>> 1; return n >>> 0; });
function crc32(u8) { let c = ~0; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return ~c >>> 0; }
function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), d = f.date;
    const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const head = (sig, extra) => {
      const b = new DataView(new ArrayBuffer(extra ? 46 : 30)); let o = 0;
      const u16 = (v) => { b.setUint16(o, v, true); o += 2; }, u32 = (v) => { b.setUint32(o, v, true); o += 4; };
      u32(sig); if (extra) u16(20); u16(20); u16(0x0800); u16(0); u16(time); u16(date);
      u32(crc); u32(f.data.length); u32(f.data.length); u16(name.length); u16(0);
      if (extra) { u16(0); u16(0); u16(0); u32(0); u32(offset); }
      return new Uint8Array(b.buffer);
    };
    central.push(head(0x02014b50, true), name);
    const local = head(0x04034b50, false);
    parts.push(local, name, f.data);
    offset += local.length + name.length + f.data.length;
  }
  const size = central.reduce((s, c) => s + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, size, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type: "application/zip" });
}
</script>
</body>
</html>
