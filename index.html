<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Wedding Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero">
  <div class="sub">WEDDING PHOTOS</div>
  <h1 class="serif" id="couple"></h1>
  <div class="date serif" id="date"></div>
</header>

<main id="app" hidden>
  <section class="panel">
    <div class="name-row">
      <input id="name" maxlength="30" placeholder="お名前（任意・写真に表示されます）" autocomplete="name">
    </div>
    <div class="film" id="film" hidden>
      <div class="film-num serif"><b id="left">–</b><span>/ <i id="limit">–</i></span></div>
      <div class="film-label">のこり枚数<small>フィルムカメラのように、1人 <i id="limit2">–</i> 枚まで撮れます</small></div>
    </div>
    <div class="actions" id="actions">
      <label class="btn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        写真を撮る
        <input id="shoot" type="file" accept="image/*" capture="environment">
      </label>
      <label class="btn ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 4 4 3-3 6 6"/></svg>
        アルバムから選ぶ
        <input id="pick" type="file" accept="image/*" multiple>
      </label>
    </div>
    <div class="status" id="status"><span id="statusText"></span><div class="bar"><i id="bar"></i></div></div>
  </section>

  <div class="count" id="count"></div>
  <section class="grid" id="grid"></section>
  <div class="empty" id="empty" hidden>まだ写真がありません。<br>最初の1枚をぜひ！</div>
</main>

<div class="empty" id="nocode" hidden>会場のQRコードを読み取って<br>このページを開いてください。</div>

<div class="lightbox" id="lb">
  <button class="close" id="lbClose" aria-label="閉じる">×</button>
  <button class="nav prev" id="lbPrev" aria-label="前へ">‹</button>
  <button class="nav next" id="lbNext" aria-label="次へ">›</button>
  <img id="lbImg" alt="">
  <div class="cap" id="lbCap"></div>
  <div class="tools">
    <a id="lbSave" target="_blank" rel="noopener">大きく表示・保存</a>
    <button id="lbHide" hidden>非表示にする</button>
  </div>
</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="guest.js"></script>
</body>
</html>
