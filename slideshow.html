<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Slideshow</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #14120f; overflow: hidden; color: #f3ecdd;
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; cursor: none; }
  .serif { font-family: "Cormorant Garamond", "Hiragino Mincho ProN", serif; }
  .layer { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
  .layer.on { opacity: 1; }
  .layer .blur { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(40px) brightness(.45); }
  .layer img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .cap { position: absolute; left: 3vw; bottom: 3vh; font-size: 2.2vh; text-shadow: 0 1px 8px #000; z-index: 3; }
  .title { position: absolute; left: 3vw; top: 3vh; z-index: 3; text-shadow: 0 1px 8px #000; }
  .title b { display: block; font-size: 4vh; font-weight: 500; letter-spacing: .05em; }
  .title span { font-size: 1.8vh; letter-spacing: .25em; color: #d9c08a; }
  .qr { position: absolute; right: 2.5vw; bottom: 3vh; z-index: 3; background: #fffdf9; color: #33302b;
    padding: 1.4vh; border-radius: 1.4vh; text-align: center; font-size: 1.7vh; line-height: 1.5; }
  .qr img { display: block; width: 15vh; height: 15vh; margin: 0 auto .6vh; image-rendering: pixelated; }
  .wait[hidden] { display: none !important; }
  .wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 3vh; line-height: 2; }
</style>
</head>
<body>
<div class="layer" id="a"><div class="blur"></div><img alt=""></div>
<div class="layer" id="b"><div class="blur"></div><img alt=""></div>
<div class="wait" id="wait">写真をお待ちしています<br>QRコードから投稿してください</div>
<div class="title"><span>WEDDING PHOTOS</span><b class="serif" id="couple"></b></div>
<div class="cap" id="cap"></div>
<div class="qr" id="qr" hidden><img id="qrImg" alt="QR">写真を投稿してね</div>

<script src="qrcode.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
const SECONDS = 7;                       // 1枚あたりの表示秒数
const $ = (id) => document.getElementById(id);
$("couple").textContent = CFG.couple;

// ゲスト用URLのQRコードを右下に出す（?qr=0 で非表示）
if (EVENT_CODE && new URLSearchParams(location.search).get("qr") !== "0" && window.qrcode) {
  const q = qrcode(0, "M");
  q.addData(new URL("index.html?k=" + encodeURIComponent(EVENT_CODE), location.href).href);
  q.make();
  $("qrImg").src = q.createDataURL(8, 0);
  $("qr").hidden = false;
}

let all = [], fresh = [], order = [], lastSeen = null, front = $("a"), back = $("b");

async function poll(full) {
  try {
    const rows = await fetchPhotos(full ? null : lastSeen);
    if (full) { all = rows; order = []; }
    else for (const r of rows) if (!all.some((p) => p.id === r.id)) { all.push(r); fresh.push(r); }
    for (const r of rows) if (!lastSeen || r.created_at > lastSeen) lastSeen = r.created_at;
  } catch (e) { console.error(e); }
}

function pick() {
  if (fresh.length) return fresh.shift();      // 新着を優先
  if (!order.length) order = [...all].sort(() => Math.random() - 0.5);
  return order.pop();
}

async function show() {
  const p = pick();
  if (!p) return;
  const url = publicUrl(p.path);
  const img = back.querySelector("img");
  try { img.src = url; await img.decode(); } catch { return; }
  back.querySelector(".blur").style.backgroundImage = `url("${url}")`;
  $("wait").hidden = true;
  back.classList.add("on"); front.classList.remove("on");
  [front, back] = [back, front];
  $("cap").textContent = p.guest_name ? `Photo by ${p.guest_name}` : "";
}

(async () => {
  await poll(true);
  show();
  setInterval(show, SECONDS * 1000);
  setInterval(() => poll(false), 10000);
  setInterval(() => poll(true), 300000);       // 非表示にした写真を反映
})();
</script>
</body>
</html>
